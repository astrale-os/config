name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/*/jsr.json'
      - 'packages/*/src/**'
      - 'packages/typescript/*.json'
      - 'packages/ox/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish-jsr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/typescript
          - packages/commitlint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publish/jsr
        with:
          package: ${{ matrix.package }}

  publish-ox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publish/packages
        with:
          dirs: 'packages/ox'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-command: 'echo "ox ships prebuilt js — no build step"'
