name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/*/jsr.json'
      - 'packages/*/src/**'
      - 'packages/typescript/*.json'
      - 'packages/ox/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/actions/publish/jsr/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish-jsr-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/publish/jsr
        with:
          package: packages/typescript
          frozen-lockfile: 'true'

  publish-jsr-commitlint:
    needs: publish-jsr-typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/publish/jsr
        with:
          package: packages/commitlint
          frozen-lockfile: 'true'

  publish-ox:
    needs: publish-jsr-commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/publish/packages
        with:
          dirs: 'packages/ox'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-command: 'echo "ox ships prebuilt js — no build step"'
