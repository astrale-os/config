name: Domains CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  domains:
    name: Domains
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Qualify discovered Domains
        uses: $/.github/actions/domains/qualify
