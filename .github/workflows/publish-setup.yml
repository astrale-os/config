name: Publish setup archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-setup-archive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate and pack
        run: |
          find setup -name '*.sh' -exec bash -n {} \;
          node --test setup/tests/*.test.cjs
          bash setup/pack.sh "$RUNNER_TEMP/setup-release"
      - name: Publish a new immutable-version candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./setup/package.json").version')"
          gh release create "setup-v$version" "$RUNNER_TEMP/setup-release/astrale-setup-$version.tar.gz" "$RUNNER_TEMP/setup-release/astrale-setup-$version.tar.gz.sha256" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Astrale setup $version" \
            --notes "Pinned setup archive from $GITHUB_SHA. Candidate pending qualification of affected consumer profiles."
