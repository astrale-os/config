name: Setup package
on:
  pull_request:
    paths: ['packages/agent-setup/**', '.github/workflows/setup-package.yml']
  push:
    branches: [main]
    paths: ['packages/agent-setup/**', '.github/workflows/setup-package.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check package contract without repository dependencies
        run: |
          find packages/agent-setup -name '*.sh' -exec bash -n {} \;
          node --test packages/agent-setup/tests/*.test.cjs
          bash packages/agent-setup/pack.sh "$RUNNER_TEMP/setup-release"
