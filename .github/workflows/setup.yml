name: Setup archive
on:
  pull_request:
    paths: ['setup/**', 'scripts/setup/**', '.github/workflows/setup.yml']
  push:
    branches: [main]
    paths: ['setup/**', 'scripts/setup/**', '.github/workflows/setup.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check package contract without repository dependencies
        run: |
          find setup -name '*.sh' -exec bash -n {} \;
          node --test setup/tests/*.test.cjs
          bash setup/pack.sh "$RUNNER_TEMP/setup-release"
      - name: Prepare Config with the candidate archive and verify reuse
        run: |
          candidate="$RUNNER_TEMP/setup-candidate"
          version="$(node -p 'require("./setup/package.json").version')"
          mkdir -p "$candidate"
          tar -xzf "$RUNNER_TEMP/setup-release/astrale-setup-$version.tar.gz" -C "$candidate"
          setup="$candidate/package/astrale-setup"
          "$setup" "$PWD" codex
          "$setup" "$PWD" verify
          "$setup" "$PWD" codex
          CLAUDE_CODE_REMOTE=true CLAUDE_ENV_FILE="$RUNNER_TEMP/astrale-claude-env" "$setup" "$PWD" claude
          CLAUDE_CODE_REMOTE=true CLAUDE_ENV_FILE="$RUNNER_TEMP/astrale-claude-env" "$setup" "$PWD" claude
          git diff --exit-code HEAD -- pnpm-lock.yaml
