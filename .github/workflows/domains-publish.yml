name: Publish Domains

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: domains-publish-${{ github.repository }}
  queue: max

jobs:
  publish-domains:
    name: Publish Domains
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Publish discovered Domains
        uses: $/.github/actions/domains/publish
        with:
          selection: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'changed' }}
          before: ${{ github.event.before }}
