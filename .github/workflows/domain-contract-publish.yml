name: Publish Domain contracts

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: domain-contract-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-domain-contracts:
    name: Publish Domain contract packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Publish discovered contracts
        uses: $/.github/actions/domain-contracts/publish
        with:
          selection: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'changed' }}
          before: ${{ github.event.before }}
