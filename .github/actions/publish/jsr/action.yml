name: Publish to JSR
description: Publish a package to JSR registry

inputs:
  node-version-file:
    description: Path to .nvmrc or similar file
    default: '.nvmrc'
  allow-slow-types:
    description: Allow publishing packages with slow types
    default: 'true'
  package:
    description: Package directory to publish (relative to repo root)
    required: true
  frozen-lockfile:
    description: Use the repository lockfile without allowing dependency drift
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js (with cache)
      if: inputs.frozen-lockfile == 'true'
      uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm

    - name: Setup Node.js (no cache)
      if: inputs.frozen-lockfile != 'true'
      uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.node-version-file }}
        package-manager-cache: false

    - name: Install dependencies (frozen)
      if: inputs.frozen-lockfile == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        STANDALONE: 'true'

    - name: Install dependencies (no frozen)
      if: inputs.frozen-lockfile != 'true'
      shell: bash
      run: pnpm install
      env:
        STANDALONE: 'true'

    - name: Build packages
      shell: bash
      run: pnpm build

    - name: Check whether the JSR version exists
      id: jsr-version
      shell: bash
      working-directory: ${{ inputs.package }}
      env:
        CHECK_PUBLISHED: ${{ github.action_path }}/check-published.mjs
      run: |
        status=0
        node "$CHECK_PUBLISHED" || status=$?

        case "$status" in
          0) echo "published=true" >> "$GITHUB_OUTPUT" ;;
          1) echo "published=false" >> "$GITHUB_OUTPUT" ;;
          *) exit "$status" ;;
        esac

    - name: Publish to JSR
      if: steps.jsr-version.outputs.published != 'true'
      shell: bash
      working-directory: ${{ inputs.package }}
      run: |
        FLAGS=""
        if [ "${{ inputs.allow-slow-types }}" = "true" ]; then
          FLAGS="--allow-slow-types"
        fi
        # The preflight above is the only idempotent skip. Authentication,
        # validation, registry and all other publishing errors must stay fatal.
        npx jsr publish $FLAGS
