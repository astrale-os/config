name: Publish to npm
description: Publish packages to npm or GitHub Packages registry

inputs:
  node-version-file:
    description: Path to .nvmrc or similar file
    default: '.nvmrc'
  registry-url:
    description: npm registry URL (without https://)
    default: 'npm.pkg.github.com'
  scope:
    description: npm scope (e.g., @astrale-os)
    required: true
  access:
    description: Package access level (public or restricted)
    default: 'restricted'
  token:
    description: npm registry token
    required: true
  frozen-lockfile:
    description: Use frozen lockfile (set to false if lockfile may not exist)
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js (with cache)
      if: inputs.frozen-lockfile == 'true'
      uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
        registry-url: https://${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Setup Node.js (no cache)
      if: inputs.frozen-lockfile != 'true'
      uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.node-version-file }}
        package-manager-cache: false
        registry-url: https://${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Install dependencies (frozen)
      if: inputs.frozen-lockfile == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
        STANDALONE: 'true'

    - name: Install dependencies (no frozen)
      if: inputs.frozen-lockfile != 'true'
      shell: bash
      run: pnpm install
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
        STANDALONE: 'true'

    - name: Build packages
      shell: bash
      run: pnpm build
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}

    - name: Publish packages
      shell: bash
      run: |
        exit_code=0
        output=$(pnpm -r publish --access ${{ inputs.access }} --no-git-checks 2>&1) || exit_code=$?
        printf '%s\n' "$output"
        if [ "$exit_code" -eq 0 ]; then
          exit 0
        fi

        echo "::error::Publish failed with exit code $exit_code"
        exit "$exit_code"
      env:
        NODE_AUTH_TOKEN: ${{ inputs.token }}
