name: Setup
description: Setup pnpm, Node.js, and install dependencies

inputs:
  node-version:
    description: Optional Node.js version or range; overrides node-version-file when set
    default: ''
  node-version-file:
    description: Path to .nvmrc or similar file
    default: '.nvmrc'
  registry-url:
    description: Optional npm registry URL (e.g. https://npm.pkg.github.com)
    default: ''
  scope:
    description: Optional scope for registry (e.g. @astrale-os)
    default: ''
  token:
    description: Optional auth token for registry
    default: ''
  frozen-lockfile:
    description: Use the repository lockfile without allowing dependency drift
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Setup Node.js (with registry, no cache)
      if: inputs.registry-url != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        package-manager-cache: false
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Setup Node.js (no registry + cache)
      if: inputs.registry-url == '' && inputs.token == '' && inputs.frozen-lockfile == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm

    - name: Setup Node.js (no registry, no cache)
      if: inputs.registry-url == '' && (inputs.token != '' || inputs.frozen-lockfile != 'true')
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      run: bash "${{ github.action_path }}/../install-dependencies.sh"
      env:
        INSTALL_FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}
        NPM_TOKEN: ''
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        ACTIONS_ID_TOKEN_REQUEST_URL: ''
