packages:
  - 'packages/*'
  - 'setup'

# Local integration uses the checked-out @astrale-os/ox package. Registry-only
# qualification belongs to consuming repositories, not this source workspace.
linkWorkspacePackages: true
preferWorkspacePackages: true
strictPeerDependencies: true

# Block packages released < 7 days ago (10080 minutes) — supply-chain hardening.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
minimumReleaseAgeExclude:
  - '@astrale-os/*'
  - '@astrale-domains/*'
  - '@astrale/*'
  - 'create-astrale-domain'

# Never install implicitly before `pnpm run` or `pnpm exec`.
verifyDepsBeforeRun: false

# Allowlist of packages permitted to run install scripts (supply-chain hardening).
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  cbor-extract: true
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  workerd: true
# Third-party `.d.ts` files reach their peer `@types` packages by walking parent
# directories, which only works while dependencies live inside the project tree.
# A machine-level global virtual store relocates them outside it and silently
# breaks type resolution, so pin the per-project store for this workspace.
virtualStoreType: project
