packages:
  - 'packages/*'

# Local integration uses the checked-out @astrale-os/ox package. Registry-only
# qualification belongs to consuming repositories, not this source workspace.
linkWorkspacePackages: true
preferWorkspacePackages: true
strictPeerDependencies: true

# Block packages released < 7 days ago (10080 minutes) — supply-chain hardening.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
minimumReleaseAgeExclude:
  - '@astrale-os/*'
  - '@astrale-domains/*'
  - '@astrale/*'
  - 'create-astrale-domain'
  - 'bun-types@1.4.0'

# Never install implicitly before `pnpm run` or `pnpm exec`.
verifyDepsBeforeRun: false

# Allowlist of packages permitted to run install scripts (supply-chain hardening).
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  cbor-extract: true
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  workerd: true
